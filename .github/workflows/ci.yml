name: biopax3 exporter ci

on:
    workflow_dispatch:
    pull_request:
        types:
            - opened
            - synchronize
    push:
        branches:
            - main

permissions:
    id-token: write
    contents: read

jobs:
    # The unit tests and ktlint's check, on JDK 17: a failing test or a lint
    # violation fails the pull request (spec 001 T003).
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '17'
                  cache: maven

            - name: Tests and lint
              run: mvn -B verify

            - name: The tools' own tests (ci/)
              run: python3 -I -m unittest discover -s ci

            - name: No person's name in the fixture graph
              run: ci/fixture/check-placeholders.sh

            - name: No relational database driver among the dependencies (FR-001)
              run: ci/no-relational.sh

            - name: The library depends on graph-core and Paxtools alone (T009)
              run: ci/lib-dependencies.sh

    # Markdown, YAML and JSON as Prettier writes them (.prettierrc, .prettierignore),
    # pinned to WebsiteAngular's version. Fix with: npx prettier@3.9.10 --write .
    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Formatted
              run: npx --yes prettier@3.9.10 --check .

    # The scripts and the workflow: ShellCheck on the shell scripts (Spec Kit's own
    # left alone), Ruff's lint and format on ci/'s Python (ruff.toml), and actionlint on
    # this workflow, which also runs ShellCheck on its run: blocks. Each pinned.
    scripts:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4

            - name: ShellCheck
              run: |
                  git ls-files -z '*.sh' ':!:.specify' |
                    xargs -0 docker run --rm --network none -v "$PWD:/mnt:ro" -w /mnt \
                      koalaman/shellcheck@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb

            - name: Ruff lint
              # Runs even when a step before it fails, so one push shows every problem.
              if: success() || failure()
              run: pipx run ruff==0.16.7 check ci

            - name: Ruff format
              if: success() || failure()
              run: pipx run ruff==0.16.7 format --check ci

            - name: actionlint
              if: success() || failure()
              run: |
                  docker run --rm --network none -v "$PWD:/repo:ro" -w /repo \
                    rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color

    docker-build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - uses: docker/build-push-action@v5
              with:
                  context: .
                  file: Dockerfile
                  tags: tmp-tag
                  outputs: type=docker,dest=/tmp/image.tar

            - uses: actions/upload-artifact@v4
              with:
                  name: image-artifact
                  path: /tmp/image.tar

    # Spec 001 T007: the exporter over the fixture graph (ci/fixture), one file per
    # species as the release writes them. Each file must be what ci/fixture/expected
    # holds by meaning (ci/compare.py), the same bytes on a second run (FR-006), and
    # free of validator errors (ci/validate.py; none allowed).
    fixture:
        needs: docker-build
        runs-on: ubuntu-latest
        services:
            neo4j:
                image: neo4j:4.4.48-community
                env:
                    NEO4J_AUTH: none
                    # graph-core reads this database
                    NEO4J_dbms_default__database: graph.db
                ports:
                    - 7687:7687
                options: >-
                    --health-cmd "cypher-shell -d graph.db 'RETURN 1'"
                    --health-interval 5s --health-timeout 10s --health-retries 30
        steps:
            - uses: actions/checkout@v4

            - name: Load the fixture graph
              run: |
                  docker cp ci/fixture/fixture.cypher ${{ job.services.neo4j.id }}:/fixture.cypher
                  docker exec ${{ job.services.neo4j.id }} cypher-shell -d graph.db -f /fixture.cypher

            - uses: actions/download-artifact@v4
              with:
                  name: image-artifact
                  path: /tmp

            - name: Convert each species, twice
              run: |
                  docker load --input /tmp/image.tar
                  for run in out out-again; do
                    mkdir -m 777 "$run"
                    # Homo sapiens and Plasmodium falciparum, by their dbIds
                    for species in 48887 170928; do
                      docker run --rm --network host -v "$PWD/$run:/out" tmp-tag \
                        -h localhost -b 7687 -u neo4j -p none -o /out -s "$species"
                    done
                  done
                  ls -l out

            - name: As expected
              run: |
                  status=0
                  for expected in ci/fixture/expected/*.owl; do
                    echo "== $(basename "$expected")"
                    python3 -I ci/compare.py --examples 5 "$expected" "out/$(basename "$expected")" || status=1
                  done
                  [ "$(find out -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)" = "$(find ci/fixture/expected -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)" ] || { echo "the files written are not the files expected"; status=1; }
                  exit $status

            - name: The same bytes on a second run (FR-006)
              run: diff -r out out-again && echo "identical"

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '17'

            - name: The BioPAX validator 6.0.0, cached by its sha1
              id: validator
              uses: actions/cache@v4
              with:
                  path: validator
                  key: biopax-validator-6.0.0-d3c7e7402a3b11915cd8e75b5d7a1d682dfce01c

            - name: Fetch the validator
              if: steps.validator.outputs.cache-hit != 'true'
              run: |
                  curl -fsSL -o distr.zip https://repo1.maven.org/maven2/org/biopax/validator/distr/6.0.0/distr-6.0.0-all.zip
                  echo "d3c7e7402a3b11915cd8e75b5d7a1d682dfce01c  distr.zip" | sha1sum -c -
                  mkdir validator && unzip -q distr.zip -d validator && rm distr.zip

            - name: Valid
              run: |
                  home=$(dirname "$(find "$PWD/validator" -name biopax-validator.jar | head -1)")
                  mkdir reports && cd reports
                  JDK_JAVA_OPTIONS="--add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.lang.reflect=ALL-UNNAMED" \
                    java -javaagent:"$home/lib/spring-instrument-6.1.5.jar" -Xmx4g -jar "$home/biopax-validator.jar" \
                    ../out --profile=notstrict --out-format=xml > ../validator.log 2>&1
                  cd ..
                  # One report per file written: a validator that stopped part way must not pass
                  # on the reports it did write. (Its log echoes display names, so it is not shown.)
                  reports=$(find reports -maxdepth 1 -name '*.validation.xml' | wc -l)
                  files=$(find out -mindepth 1 -maxdepth 1 | wc -l)
                  [ "$reports" = "$files" ] || { echo "$reports reports for $files files"; exit 1; }
                  python3 -I ci/validate.py reports/*.xml

    docker-push:
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        needs: [docker-build, verify, fixture]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: image-artifact
                  path: /tmp

            - id: get-hash
              run: |
                  FULL_SHA=${{ github.sha }}
                  echo "SHORT_SHA=${FULL_SHA:0:7}" >> "$GITHUB_OUTPUT"

            - env:
                  AWS_REGION: us-east-1
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ vars.AWS_ROLE }}
                  aws-region: ${{ env.AWS_REGION }}

            - id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2
              with:
                  registry-type: public

            - env:
                  AWS_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  AWS_REGISTRY_ALIAS: reactome
                  AWS_REPO: biopax3-exporter
                  IMG_TAG: ${{ steps.get-hash.outputs.SHORT_SHA }}
              run: |
                  docker load --input /tmp/image.tar
                  docker image tag tmp-tag "$AWS_REGISTRY/$AWS_REGISTRY_ALIAS/$AWS_REPO:latest"
                  docker image tag tmp-tag "$AWS_REGISTRY/$AWS_REGISTRY_ALIAS/$AWS_REPO:$IMG_TAG"
                  docker push "$AWS_REGISTRY/$AWS_REGISTRY_ALIAS/$AWS_REPO:latest"
                  docker push "$AWS_REGISTRY/$AWS_REGISTRY_ALIAS/$AWS_REPO:$IMG_TAG"
